<style>
  :root{
    --ink: #14150F;
    --surface: #1F2118;
    --surface-raised: #262819;
    --bone: #EDE8DA;
    --muted: #8C8A78;
    --ember: #C4622D;
    --ember-dim: #7A3E1E;
    --moss: #8FA876;
    --moss-dim: #45532F;
    --divider: #35362A;
    --danger: #A85A4A;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    background:var(--ink);
    color:var(--bone);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    background-image:
      radial-gradient(circle at 15% 8%, rgba(196,98,45,0.06), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(143,168,118,0.05), transparent 45%);
  }
  .app{ width:100%; max-width:480px; min-height:100vh; display:flex; flex-direction:column; position:relative; }

  /* Header */
  .header{ padding:28px 20px 18px; border-bottom:1px solid var(--divider); }
  .eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.18em; color:var(--muted); text-transform:uppercase; }
  .date-stamp{
    font-family:'Oswald', sans-serif; font-weight:700; font-size:34px; letter-spacing:0.01em;
    text-transform:uppercase; margin-top:4px; color:var(--bone);
    display:flex; align-items:baseline; gap:10px;
  }
  .date-stamp .day{ color:var(--ember); }
  .backup-bar{ display:flex; gap:14px; margin-top:12px; }
  .backup-link{
    background:none; border:1px solid var(--divider); color:var(--muted); font-family:'IBM Plex Mono', monospace;
    font-size:10px; letter-spacing:0.06em; text-transform:uppercase; padding:6px 10px; border-radius:2px; cursor:pointer;
  }
  .backup-link:active{ color:var(--ember); border-color:var(--ember); }

  /* Tabs */
  .tabs{
    display:flex; border-bottom:1px solid var(--divider);
    position:sticky; top:0; background:var(--ink); z-index:10;
  }
  .tab{
    flex:1; padding:14px 3px; text-align:center; font-family:'IBM Plex Mono', monospace;
    font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted);
    background:none; border:none; cursor:pointer; position:relative;
  }
  .tab.active{ color:var(--bone); }
  .tab.active::after{
    content:''; position:absolute; bottom:-1px; left:20%; right:20%; height:2px; background:var(--ember);
  }

  .view{ display:none; padding:22px 20px 90px; flex:1; }
  .view.active{ display:block; animation:fade .25s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .section-title{
    font-family:'Oswald', sans-serif; font-weight:600; font-size:13px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--muted); margin-bottom:14px; display:flex; align-items:center; gap:8px;
  }
  .section-title::before{ content:''; width:14px; height:1px; background:var(--ember); display:inline-block; }

  /* Scoreboard */
  .scoreboard{
    display:flex; gap:10px; margin-bottom:26px;
  }
  .score-card{
    flex:1; background:var(--surface); border:1px solid var(--divider); border-radius:2px;
    padding:14px 10px; text-align:center;
  }
  .score-num{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:28px; color:var(--ember); line-height:1; }
  .score-num.moss{ color:var(--moss); }
  .score-label{ font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin-top:6px; }

  /* Habit rows */
  .habit-row{
    display:flex; align-items:center; gap:14px; padding:14px 4px; border-bottom:1px solid var(--divider);
  }
  .stamp-btn{
    width:40px; height:40px; border-radius:50%; border:2px solid var(--divider); background:transparent;
    cursor:pointer; flex-shrink:0; position:relative; transition:all .15s ease;
  }
  .stamp-btn.done{ border-color:var(--moss); background:var(--moss-dim); }
  .stamp-btn.done::after{
    content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--moss); font-size:18px; font-weight:700;
  }
  .habit-info{ flex:1; min-width:0; }
  .habit-name{ font-size:15px; font-weight:500; color:var(--bone); }
  .habit-streak{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted); margin-top:2px; }
  .habit-streak .n{ color:var(--ember); font-weight:600; }
  .del-btn{
    background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; padding:6px;
    opacity:0.6;
  }

  /* Punch card grid (habits tab) */
  .habit-block{ margin-bottom:22px; background:var(--surface); border:1px solid var(--divider); border-radius:3px; padding:16px; }
  .habit-block-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .habit-block-name{ font-family:'Oswald', sans-serif; font-size:17px; font-weight:600; text-transform:uppercase; letter-spacing:0.01em; }
  .punch-grid{ display:grid; grid-template-columns:repeat(14,1fr); gap:5px; }
  .punch{ aspect-ratio:1; border-radius:50%; border:1.5px solid var(--divider); }
  .punch.on{ background:var(--ember); border-color:var(--ember); }

  /* Forms */
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .field input, .field select{
    width:100%; background:var(--surface); border:1px solid var(--divider); color:var(--bone);
    padding:11px 12px; border-radius:2px; font-family:'IBM Plex Sans', sans-serif; font-size:15px;
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--ember); }
  .row-2{ display:flex; gap:10px; }
  .row-2 .field{ flex:1; }
  .btn{
    width:100%; padding:13px; background:var(--ember); color:var(--ink); border:none; border-radius:2px;
    font-family:'Oswald', sans-serif; font-weight:600; font-size:14px; letter-spacing:0.08em; text-transform:uppercase;
    cursor:pointer; margin-top:4px;
  }
  .btn.ghost{ background:transparent; border:1px solid var(--divider); color:var(--bone); }
  .btn.small{ width:auto; padding:8px 16px; font-size:12px; }

  .add-form{ background:var(--surface); border:1px solid var(--divider); border-radius:3px; padding:16px; margin-bottom:20px; }

  /* Exercise log entries */
  .exercise-line{ background:var(--surface-raised); border:1px solid var(--divider); border-radius:3px; padding:10px; margin-bottom:10px; }
  .exercise-line-top{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .exercise-line-top .ex-name{ flex:1; min-width:0; }
  .exercise-line .rm{ background:none; border:none; color:var(--danger); font-size:18px; cursor:pointer; flex-shrink:0; padding:2px 4px; }
  .exercise-num-labels{ display:flex; gap:8px; margin-bottom:4px; }
  .exercise-num-labels span{ flex:1; text-align:center; font-size:9px; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); }
  .exercise-line-nums{ display:flex; gap:8px; }
  .exercise-line input{ background:var(--surface); border:1px solid var(--divider); color:var(--bone); padding:9px; border-radius:2px; font-size:14px; width:100%; box-sizing:border-box; }
  .exercise-line .ex-num{ flex:1; min-width:0; text-align:center; }
  .add-exercise{ background:none; border:1px dashed var(--divider); color:var(--muted); padding:8px; width:100%; border-radius:2px; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; cursor:pointer; margin-bottom:12px; }

  /* Workout history cards */
  .workout-card{ background:var(--surface); border:1px solid var(--divider); border-radius:3px; padding:16px; margin-bottom:12px; }
  .workout-card-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .workout-date{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted); letter-spacing:0.05em; text-transform:uppercase; }
  .workout-title{ font-family:'Oswald', sans-serif; font-weight:600; font-size:16px; text-transform:uppercase; }
  .ex-row{ display:flex; justify-content:space-between; font-size:13px; color:var(--muted); padding:4px 0; border-top:1px solid var(--divider); }
  .ex-row .n{ color:var(--bone); }
  .ex-row span:last-child{ font-family:'IBM Plex Mono', monospace; }

  /* Empty state */
  .empty{ text-align:center; padding:50px 20px; color:var(--muted); }
  .empty .mark{ font-family:'Oswald', sans-serif; font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:var(--bone); margin-bottom:6px; }
  .empty p{ font-size:13px; line-height:1.5; }

  /* Weight chart */
  .chart-wrap{ background:var(--surface); border:1px solid var(--divider); border-radius:3px; padding:16px; margin-bottom:20px; }
  .chart-stats{ display:flex; justify-content:space-between; margin-top:10px; padding-top:10px; border-top:1px solid var(--divider); }
  .chart-stat{ text-align:center; flex:1; }
  .chart-stat .v{ font-family:'IBM Plex Mono', monospace; font-size:18px; font-weight:600; color:var(--bone); }
  .chart-stat .l{ font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px; }

  .weight-entry{ display:flex; justify-content:space-between; align-items:center; padding:10px 4px; border-bottom:1px solid var(--divider); font-size:13px; }
  .weight-entry .d{ color:var(--muted); font-family:'IBM Plex Mono', monospace; font-size:11px; }
  .weight-entry .v{ font-family:'IBM Plex Mono', monospace; font-weight:600; }

  .loading{ display:flex; align-items:center; justify-content:center; height:100vh; color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; }

  /* Auth screen */
  .auth-wrap{ width:100%; max-width:420px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:32px 24px; }
  .auth-eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.18em; color:var(--muted); text-transform:uppercase; text-align:center; }
  .auth-title{ font-family:'Oswald', sans-serif; font-weight:700; font-size:28px; text-transform:uppercase; text-align:center; margin:6px 0 30px; color:var(--bone); }
  .auth-title span{ color:var(--ember); }
  .auth-mode-toggle{ display:flex; border:1px solid var(--divider); border-radius:2px; margin-bottom:22px; }
  .auth-mode-btn{ flex:1; padding:11px; background:none; border:none; color:var(--muted); font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; cursor:pointer; }
  .auth-mode-btn.active{ background:var(--surface); color:var(--bone); }
  .auth-error{ background:rgba(168,90,74,0.15); border:1px solid var(--danger); color:#E0A091; padding:10px 12px; border-radius:2px; font-size:12px; margin-bottom:14px; }
  .auth-loading{ text-align:center; color:var(--muted); font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; margin-top:10px; }

  .account-bar{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; }
  .account-email{ font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px; }

  /* Bar chart (habit completion / calories) */
  .bar-chart-svg{ width:100%; display:block; }
  .bar-legend{ display:flex; gap:16px; margin-top:10px; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }
  .legend-dot{ width:9px; height:9px; border-radius:2px; }

  /* Calorie entries */
  .cal-entry{ display:flex; justify-content:space-between; align-items:center; padding:11px 4px; border-bottom:1px solid var(--divider); font-size:13px; }
  .cal-entry .d{ color:var(--muted); font-family:'IBM Plex Mono', monospace; font-size:11px; flex:1; }
  .cal-entry .nums{ display:flex; gap:14px; font-family:'IBM Plex Mono', monospace; }
  .cal-entry .in{ color:var(--ember); }
  .cal-entry .out{ color:var(--moss); }
  .cal-entry .net{ color:var(--bone); font-weight:600; }

  /* Goal calculator */
  .goal-result{ background:var(--surface-raised); border:1px solid var(--divider); border-radius:3px; padding:16px; margin-top:14px; }
  .goal-headline{ font-family:'Oswald', sans-serif; font-weight:600; font-size:15px; text-transform:uppercase; letter-spacing:0.03em; color:var(--ember); margin-bottom:10px; }
  .goal-row{ display:flex; justify-content:space-between; padding:7px 0; border-top:1px solid var(--divider); font-size:13px; }
  .goal-row:first-of-type{ border-top:none; }
  .goal-row .l{ color:var(--muted); }
  .goal-row .v{ font-family:'IBM Plex Mono', monospace; font-weight:600; color:var(--bone); }
  .goal-note{ font-size:11px; color:var(--muted); margin-top:10px; line-height:1.5; }

  .scoreboard.four .score-card{ padding:12px 6px; }
  .scoreboard.four .score-num{ font-size:22px; }

  /* Milestone badges & toast */
  .milestone-badge{ display:inline-flex; align-items:center; gap:3px; background:rgba(196,98,45,0.15); color:var(--ember); font-size:9px; padding:2px 7px; border-radius:10px; margin-left:8px; text-transform:uppercase; letter-spacing:0.04em; font-family:'IBM Plex Mono',monospace; white-space:nowrap; }
  .milestone-toast{
    position:fixed; top:20px; left:50%; transform:translate(-50%,-20px); opacity:0;
    background:var(--surface-raised); border:1px solid var(--ember); border-radius:6px; padding:14px 22px;
    display:flex; align-items:center; gap:10px; z-index:999; transition:all .35s ease; box-shadow:0 8px 24px rgba(0,0,0,0.4);
    max-width:88vw;
  }
  .milestone-toast.show{ opacity:1; transform:translate(-50%,0); }
  .milestone-toast-emoji{ font-size:24px; flex-shrink:0; }
  .milestone-toast-text{ font-family:'Oswald',sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:var(--bone); font-size:13px; }

  /* Template / food preset chips */
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .chip{ background:var(--surface); border:1px solid var(--divider); color:var(--bone); padding:8px 10px; border-radius:20px; font-size:12px; display:flex; align-items:center; gap:8px; cursor:pointer; }
  .chip:active{ border-color:var(--ember); }
  .chip .chip-del{ color:var(--muted); font-size:12px; padding:1px; line-height:1; }

  /* Report block */
  .report-summary{ margin-top:16px; }
  .report-stat-row{ display:flex; gap:8px; margin-bottom:14px; }
  .report-stat{ flex:1; background:var(--surface-raised); border:1px solid var(--divider); border-radius:2px; padding:10px 8px; text-align:center; }
  .report-stat .v{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:18px; color:var(--ember); }
  .report-stat .l{ font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-top:3px; }
  .report-table-title{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin:14px 0 8px; }
  .report-table{ width:100%; border-collapse:collapse; font-size:12px; }
  .report-table th{ text-align:left; color:var(--muted); font-weight:500; font-size:10px; letter-spacing:0.05em; text-transform:uppercase; padding:6px 4px; border-bottom:1px solid var(--divider); }
  .report-table td{ padding:7px 4px; border-bottom:1px solid var(--divider); color:var(--bone); }
  .report-table tr:last-child td{ border-bottom:none; }
  .export-row{ display:flex; gap:8px; margin-top:16px; }

  .export-row .btn.html{ background:var(--ember); color:var(--ink); }

  ::-webkit-scrollbar{ width:0; height:0; }

</div>

<script>
let data = { habits: [], checkins: {}, workouts: [], weights: [], calories: {}, calorieGoal: null, bmrProfile: null, templates: [], foodPresets: [] };
let currentTab = 'today';
let draftExercises = [{name:'', sets:'', reps:'', weight:''}];
let reportFrom = null, reportTo = null, reportGenerated = null;
let selectedEntryDate = null;
let editingWorkoutId = null;
let currentUser = null;
let authMode = 'signin';
let authError = '';
let authBusy = false;
let authEmailDraft = '';
let audioCtx = null;

function localDateStr(d){
  const yr = d.getFullYear();
  const mo = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${yr}-${mo}-${day}`;
}
function todayStr(){ return localDateStr(new Date()); }
function fmtDate(d){ const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'}); }
function last14Dates(){ const arr=[]; for(let i=13;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); arr.push(localDateStr(d)); } return arr; }

async function loadData(){
  if(!currentUser) return;
  try{
    const docSnap = await db.collection('users').doc(currentUser.uid).get();
    if(docSnap.exists && docSnap.data().payload){
      data = JSON.parse(docSnap.data().payload);
    } else {
      data = { habits: [], checkins: {}, workouts: [], weights: [], calories: {}, calorieGoal: null, bmrProfile: null, templates: [], foodPresets: [] };
    }
  }catch(e){ console.error('load failed', e); alert('Could not load your data — check your internet connection.'); }
  if(!data.calories) data.calories = {};
  if(data.calorieGoal===undefined) data.calorieGoal = null;
  if(data.bmrProfile===undefined) data.bmrProfile = null;
  if(!data.templates) data.templates = [];
  if(!data.foodPresets) data.foodPresets = [];
  render();
}
async function saveData(){
  if(!currentUser) return;
  try{
    await db.collection('users').doc(currentUser.uid).set({
      payload: JSON.stringify(data),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){ console.error('save failed', e); alert('Could not save — check your internet connection.'); }
}

function friendlyAuthError(code){
  const map = {
    'auth/email-already-in-use': 'An account with this email already exists. Try signing in instead.',
    'auth/invalid-email': 'That email address looks invalid.',
    'auth/weak-password': 'Password should be at least 6 characters.',
    'auth/user-not-found': 'No account found with that email.',
    'auth/wrong-password': 'Incorrect password.',
    'auth/invalid-credential': 'Incorrect email or password.',
    'auth/too-many-requests': 'Too many attempts. Please wait a moment and try again.'
  };
  return map[code] || 'Something went wrong. Please try again.';
}

function setAuthMode(m){ authMode = m; authError = ''; renderAuthScreen(); }

async function doSignIn(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  authEmailDraft = email;
  if(!email || !password){ authError = 'Please enter both email and password.'; renderAuthScreen(); return; }
  authBusy = true; authError = ''; renderAuthScreen();
  try{
    await auth.signInWithEmailAndPassword(email, password);
  }catch(e){
    authBusy = false; authError = friendlyAuthError(e.code); renderAuthScreen();
  }
}

async function doSignUp(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  authEmailDraft = email;
  if(!email || !password){ authError = 'Please enter both email and password.'; renderAuthScreen(); return; }

function handleImportFile(evt){

function calcStreak(habitId){
  let streak=0; let d=new Date();
  // if today not done yet, streak counts through yesterday
  const t = todayStr();
  if(!(data.checkins[t]||[]).includes(habitId)) d.setDate(d.getDate()-1);
  while(true){
    const ds = localDateStr(d);
    if((data.checkins[ds]||[]).includes(habitId)){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

function calcOverallStreak(){
  if(data.habits.length===0) return 0;
  let streak=0; let d=new Date();
  const t = todayStr();
  const todayDone = (data.checkins[t]||[]).length;
  if(todayDone < data.habits.length) d.setDate(d.getDate()-1);
  while(true){
    const ds = localDateStr(d);
    const doneCount = (data.checkins[ds]||[]).length;
    if(doneCount >= data.habits.length && data.habits.length>0){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

function habitCompletionSeries(numDays){
  const total = data.habits.length;
  const arr = [];
  for(let i=numDays-1;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = localDateStr(d);
    const done = (data.checkins[ds]||[]).length;
    const pct = total>0 ? Math.round((Math.min(done,total)/total)*100) : 0;
    arr.push({ date: ds, pct });
  }
  return arr;
}

function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
  }
  return audioCtx;
}
function playTickFeedback(turningOn){
  try{ if(navigator.vibrate) navigator.vibrate(turningOn ? 15 : 10); }catch(e){}
  const ctx = getAudioCtx();
  if(!ctx) return;
  try{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = turningOn ? 740 : 380;
    gain.gain.setValueAtTime(0.09, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.12);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.13);
  }catch(e){}
}

const MILESTONES = [7, 30, 100];
function milestoneBadge(streak){
  if(streak>=100) return { emoji:'🏆', label:'100+ Day Streak' };
  if(streak>=30) return { emoji:'🔥', label:'30+ Day Streak' };
  if(streak>=7) return { emoji:'⭐', label:'7+ Day Streak' };
  return null;
}
function showMilestoneToast(streak, label){
  const badge = milestoneBadge(streak);
  if(!badge) return;
  const toast = document.createElement('div');
  toast.className = 'milestone-toast';
  toast.innerHTML = `<div class="milestone-toast-emoji">${badge.emoji}</div><div class="milestone-toast-text">${streak}-Day Streak${label ? ' — ' + escapeHtml(label) : ''}!</div>`;
  document.body.appendChild(toast);
  setTimeout(()=>{ toast.classList.add('show'); }, 10);
  setTimeout(()=>{ toast.classList.remove('show'); setTimeout(()=>toast.remove(), 400); }, 2600);
}

function toggleHabit(habitId){
  const t = selectedEntryDate || todayStr();
  if(!data.checkins[t]) data.checkins[t] = [];
  const idx = data.checkins[t].indexOf(habitId);
  const turningOn = idx===-1;
  if(idx>-1) data.checkins[t].splice(idx,1);
  else data.checkins[t].push(habitId);
  playTickFeedback(turningOn);
  saveData(); render();
  if(turningOn && t===todayStr()){
    const habit = data.habits.find(h=>h.id===habitId);
    const streak = calcStreak(habitId);
    if(MILESTONES.includes(streak)) showMilestoneToast(streak, habit ? habit.name : '');
  }
}

function renderCalorieChart(){
  const dates = calorieDates(14);
  const cW = 400, cH = 110, gap = 4;
  const groupW = (cW/dates.length);
  const barW = (groupW-gap)/2 - 1;
  const maxVal = Math.max(200, ...dates.map(d=>{
    const e = data.calories[d]||{in:0,out:0};
    return Math.max(e.in,e.out);
  }));
  return `
    <div class="chart-wrap">
      <div class="section-title" style="margin-bottom:8px;">Intake vs Burn — Last 14 Days</div>
      <svg class="bar-chart-svg" viewBox="0 0 ${cW} ${cH}" preserveAspectRatio="none">
        ${dates.map((d,i)=>{
          const e = data.calories[d]||{in:0,out:0};
          const hIn = e.in>0 ? Math.max(2,(e.in/maxVal)*cH) : 0;
          const hOut = e.out>0 ? Math.max(2,(e.out/maxVal)*cH) : 0;
          const gx = i*groupW;
          return `
            <rect x="${gx.toFixed(1)}" y="${(cH-hIn).toFixed(1)}" width="${barW.toFixed(1)}" height="${hIn.toFixed(1)}" fill="#C4622D" rx="1"/>
            <rect x="${(gx+barW+2).toFixed(1)}" y="${(cH-hOut).toFixed(1)}" width="${barW.toFixed(1)}" height="${hOut.toFixed(1)}" fill="#8FA876" rx="1"/>
          `;
        }).join('')}
      </svg>
      <div class="bar-legend">
        <div class="legend-item"><span class="legend-dot" style="background:#C4622D"></span>Calories In</div>
        <div class="legend-item"><span class="legend-dot" style="background:#8FA876"></span>Calories Burned</div>
      </div>
    </div>
  `;
}

function calcBMRMaintenance(){
  const age = parseFloat(document.getElementById('bmrAge').value);
  const height = parseFloat(document.getElementById('bmrHeight').value);
  const gender = document.getElementById('bmrGender').value;
  const activity = document.getElementById('bmrActivity').value;
  const weightInput = document.getElementById('goalCurrentWeight');
  const weight = parseFloat(weightInput ? weightInput.value : NaN);
  const resultEl = document.getElementById('bmrResult');
  if(isNaN(age) || isNaN(height) || isNaN(weight)){
    if(resultEl) resultEl.innerHTML = `<div class="auth-error" style="margin-top:10px;">Fill in Age, Height, and Current Weight (above) first.</div>`;
    return;
  }
  data.bmrProfile = { age, height, gender, activity };
  saveData();
  const bmr = gender==='female'
    ? (10*weight + 6.25*height - 5*age - 161)
    : (10*weight + 6.25*height - 5*age + 5);
  const factors = { sedentary:1.2, light:1.375, moderate:1.55, active:1.725, veryactive:1.9 };
  const maintenance = Math.round(bmr * (factors[activity] || 1.2));
  const maintInput = document.getElementById('goalMaintenance');
  if(maintInput) maintInput.value = maintenance;
  if(resultEl) resultEl.innerHTML = `<div class="goal-note" style="margin-top:10px;">Estimated maintenance: <strong style="color:var(--bone)">${maintenance.toLocaleString()} kcal/day</strong> — filled into the field above. Uses the Mifflin-St Jeor formula, a widely-used estimate, not a medical measurement.</div>`;
}

function renderGoalCalculator(){
  const g = data.calorieGoal;
  const bp = data.bmrProfile || {};
  const latestWeight = data.weights.length ? data.weights[data.weights.length-1].value : '';
  let resultHtml = '';
  if(g){
    const diff = g.currentWeight - g.targetWeight;
    const direction = diff>0 ? 'lose' : diff<0 ? 'gain' : 'maintain';
    const totalCal = Math.abs(diff) * KCAL_PER_KG;
    const dailyChange = g.days>0 ? totalCal / g.days : 0;
    let recommendedIntake = null;
    if(g.maintenance!==null && g.maintenance!==undefined){
      recommendedIntake = direction==='lose' ? g.maintenance - dailyChange : direction==='gain' ? g.maintenance + dailyChange : g.maintenance;
    }
    resultHtml = `
      <div class="goal-result">
        <div class="goal-headline">${direction==='maintain' ? 'Already at target' : `${Math.abs(diff).toFixed(1)} kg to ${direction}`}</div>
        <div class="goal-row"><span class="l">Total calories to ${direction==='gain'?'consume extra':'burn net'}</span><span class="v">${Math.round(totalCal).toLocaleString()} kcal</span></div>
        <div class="goal-row"><span class="l">Daily ${direction==='gain'?'surplus':'deficit'} needed</span><span class="v">${Math.round(dailyChange).toLocaleString()} kcal/day</span></div>
        ${recommendedIntake!==null ? `<div class="goal-row"><span class="l">Recommended daily intake</span><span class="v">${Math.round(recommendedIntake).toLocaleString()} kcal</span></div>` : ''}
        <div class="goal-note">Estimate uses ~7700 kcal per kg of body weight. Enter your daily maintenance calories above to see a suggested intake target. This is a general estimate, not medical advice.</div>
        <button class="btn ghost small" style="margin-top:12px;" onclick="clearGoal()">Reset Calculator</button>
      </div>
    `;
  }
  return `
    <div class="add-form">
      <div class="section-title" style="margin-bottom:12px;">Goal Calculator</div>
      <div class="row-2">
        <div class="field">
          <label>Current Weight (kg)</label>
          <input type="number" step="0.1" id="goalCurrentWeight" value="${g ? g.currentWeight : latestWeight}" placeholder="e.g. 78">
        </div>
        <div class="field">
          <label>Target Weight (kg)</label>
          <input type="number" step="0.1" id="goalTargetWeight" value="${g ? g.targetWeight : ''}" placeholder="e.g. 72">
        </div>
      </div>
      <div class="row-2">
        <div class="field">
          <label>Timeframe (days)</label>
          <input type="number" id="goalDays" value="${g ? g.days : ''}" placeholder="e.g. 60">
        </div>
        <div class="field">
          <label>Maintenance Cal/day (optional)</label>
          <input type="number" id="goalMaintenance" value="${g && g.maintenance!==null ? g.maintenance : ''}" placeholder="e.g. 2200">
        </div>
      </div>

      <div class="section-title" style="margin-top:6px; margin-bottom:10px;">Don't Know Your Maintenance? Estimate It</div>
      <div class="row-2">
        <div class="field">
          <label>Age</label>
          <input type="number" id="bmrAge" value="${bp.age||''}" placeholder="e.g. 28">
        </div>
        <div class="field">
          <label>Height (cm)</label>
          <input type="number" id="bmrHeight" value="${bp.height||''}" placeholder="e.g. 175">
        </div>
      </div>
      <div class="row-2">
        <div class="field">
          <label>Gender</label>
          <select id="bmrGender">
            <option value="male" ${bp.gender==='male'?'selected':''}>Male</option>
            <option value="female" ${bp.gender==='female'?'selected':''}>Female</option>
          </select>
        </div>
        <div class="field">
          <label>Activity Level</label>
          <select id="bmrActivity">
            <option value="sedentary" ${bp.activity==='sedentary'?'selected':''}>Sedentary</option>
            <option value="light" ${(!bp.activity||bp.activity==='light')?'selected':''}>Light (1–3d/wk)</option>

function defaultReportDates(){
  if(!reportTo) reportTo = todayStr();
  if(!reportFrom){ const d = new Date(); d.setDate(d.getDate()-30); reportFrom = localDateStr(d); }
}

function generateReport(){
  const from = document.getElementById('reportFrom').value;
  const to = document.getElementById('reportTo').value;
  if(!from || !to || from > to){ alert('Please choose a valid From date that is on or before the To date.'); return; }
  reportFrom = from; reportTo = to;
  reportGenerated = compileReport(from, to);
  render();
}

function compileReport(from, to){
  const inRange = (d) => d>=from && d<=to;
  const habitDays = [];
  let cursor = new Date(from+'T00:00:00');
  const end = new Date(to+'T00:00:00');
  while(cursor <= end){
    const ds = localDateStr(cursor);
    const doneIds = data.checkins[ds] || [];
    habitDays.push({ date: ds, done: doneIds.length, total: data.habits.length });
    cursor.setDate(cursor.getDate()+1);
  }
  const weights = data.weights.filter(w=>inRange(w.date));
  const workouts = data.workouts.filter(w=>inRange(w.date));
  const calorieEntries = Object.keys(data.calories).filter(inRange).sort()
    .map(d=>({ date: d, in: data.calories[d].in, out: data.calories[d].out }));
  return { from, to, habitDays, weights, workouts, calorieEntries };
}

function renderReportSummary(r){
  const totalDays = r.habitDays.length;
  const perfectDays = r.habitDays.filter(d=>d.total>0 && d.done>=d.total).length;
  const avgCompletion = totalDays>0
    ? Math.round(r.habitDays.reduce((s,d)=> s + (d.total>0 ? (d.done/d.total*100) : 0), 0) / totalDays)
    : 0;
  const totalCalIn = r.calorieEntries.reduce((s,e)=>s+e.in,0);
  const totalCalOut = r.calorieEntries.reduce((s,e)=>s+e.out,0);

  let html = `
    <div class="report-summary">
      <div class="report-stat-row">
        <div class="report-stat"><div class="v">${perfectDays}</div><div class="l">Perfect Days</div></div>
        <div class="report-stat"><div class="v">${avgCompletion}%</div><div class="l">Avg Completion</div></div>
        <div class="report-stat"><div class="v">${r.workouts.length}</div><div class="l">Workouts</div></div>
        <div class="report-stat"><div class="v">${r.weights.length}</div><div class="l">Weight Logs</div></div>
      </div>
  `;

  if(r.weights.length){
    html += `<div class="report-table-title">Weight Entries</div>
      <table class="report-table"><thead><tr><th>Date</th><th>Weight (kg)</th></tr></thead><tbody>
      ${r.weights.map(w=>`<tr><td>${fmtDate(w.date)}</td><td>${w.value}</td></tr>`).join('')}
      </tbody></table>`;
  }
  if(r.workouts.length){
    html += `<div class="report-table-title">Workout Sessions</div>
      <table class="report-table"><thead><tr><th>Date</th><th>Session</th><th>Exercises</th></tr></thead><tbody>
      ${r.workouts.map(w=>`<tr><td>${fmtDate(w.date)}</td><td>${escapeHtml(w.title)}</td><td>${w.exercises.length}</td></tr>`).join('')}
      </tbody></table>`;
  }
  if(r.calorieEntries.length){
    html += `<div class="report-table-title">Calories &nbsp;·&nbsp; In ${totalCalIn} · Out ${totalCalOut}</div>
      <table class="report-table"><thead><tr><th>Date</th><th>In</th><th>Out</th><th>Net</th></tr></thead><tbody>
      ${r.calorieEntries.map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${e.in}</td><td>${e.out}</td><td>${e.in-e.out}</td></tr>`).join('')}
      </tbody></table>`;
  }

  html += `
      <div class="export-row">
        <button class="btn html" onclick="downloadReportHTML()">HTML</button>
        <button class="btn excel" onclick="downloadReportExcel()">Excel</button>
        <button class="btn pdf" onclick="downloadReportPDF()">PDF</button>
      </div>
    </div>
  `;
  return html;
}

function triggerFileDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadReportHTML(){

function downloadReportExcel(){
  if(!reportGenerated) return;
  if(typeof XLSX === 'undefined'){ alert('Excel library did not load — check your internet connection and try again.'); return; }
  const r = reportGenerated;
  const wb = XLSX.utils.book_new();

  const habitSheet = XLSX.utils.json_to_sheet(r.habitDays.map(d=>({
    Date: d.date, Done: d.done, Total: d.total, Percent: d.total>0 ? Math.round(d.done/d.total*100) : 0
  })));
  XLSX.utils.book_append_sheet(wb, habitSheet, 'Habits');

  if(r.weights.length){
    const wSheet = XLSX.utils.json_to_sheet(r.weights.map(w=>({ Date:w.date, Weight_kg:w.value })));
    XLSX.utils.book_append_sheet(wb, wSheet, 'Weight');
  }
  if(r.workouts.length){
    const rows = [];
    r.workouts.forEach(w=> w.exercises.forEach(e=> rows.push({
      Date:w.date, Session:w.title, Exercise:e.name, Sets:e.sets||'', Reps:e.reps||'', Weight_kg:e.weight||''
    })));
    const woSheet = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, woSheet, 'Workouts');
  }
  if(r.calorieEntries.length){
    const cSheet = XLSX.utils.json_to_sheet(r.calorieEntries.map(e=>({
      Date:e.date, Calories_In:e.in, Calories_Out:e.out, Net:e.in-e.out
    })));
    XLSX.utils.book_append_sheet(wb, cSheet, 'Calories');
  }
  XLSX.writeFile(wb, `ledger-report-${r.from}_to_${r.to}.xlsx`);
}

    const latest = w[w.length-1].value;
    const first = w[0].value;
    const diff = (latest-first).toFixed(1);
    let min = Math.min(...w.map(x=>x.value));
    let max = Math.max(...w.map(x=>x.value));
    const target = (data.calorieGoal && data.calorieGoal.targetWeight!==undefined && data.calorieGoal.targetWeight!==null && !isNaN(data.calorieGoal.targetWeight))
      ? data.calorieGoal.targetWeight : null;
    if(target !== null){ min = Math.min(min, target); max = Math.max(max, target); }

    const chartW = 400, chartH = 120, pad = 10;
    const range = (max-min)||1;
    const pts = w.map((pt,i)=>{
      const x = w.length>1 ? pad + (i/(w.length-1))*(chartW-2*pad) : chartW/2;
      const y = chartH - pad - ((pt.value-min)/range)*(chartH-2*pad);
      return [x,y];
    });
    const pathD = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');

    let targetLineSvg = '';
    if(target !== null){
      const ty = chartH - pad - ((target-min)/range)*(chartH-2*pad);
      targetLineSvg = `
        <line x1="${pad}" y1="${ty.toFixed(1)}" x2="${chartW-pad}" y2="${ty.toFixed(1)}" stroke="#8FA876" stroke-width="1.5" stroke-dasharray="5,4"/>
      `;
    }
    const toGoalStat = target !== null
      ? `<div class="chart-stat"><div class="v" style="color:#8FA876">${(latest-target)>=0?'+':''}${(latest-target).toFixed(1)}</div><div class="l">To Target</div></div>`
      : '';

    html += `
      <div class="chart-wrap">
        <div class="section-title" style="margin-bottom:6px;">Weight Trend</div>
        <svg viewBox="0 0 ${chartW} ${chartH}" width="100%" height="${chartH}" preserveAspectRatio="none">
          ${targetLineSvg}
          <path d="${pathD}" fill="none" stroke="#C4622D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
          ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#EDE8DA"/>`).join('')}
        </svg>
        ${target !== null ? `<div class="bar-legend"><div class="legend-item"><span class="legend-dot" style="background:#8FA876"></span>Target: ${target} kg</div></div>` : ''}
        <div class="chart-stats">
          <div class="chart-stat"><div class="v">${latest}</div><div class="l">Latest</div></div>
          <div class="chart-stat"><div class="v" style="color:${diff<=0?'#8FA876':'#C4622D'}">${diff>0?'+':''}${diff}</div><div class="l">Change</div></div>
          <div class="chart-stat"><div class="v">${min}–${max}</div><div class="l">Range</div></div>
          ${toGoalStat}
        </div>
      </div>
      <div class="section-title">Recent Log</div>
    `;
    [...w].reverse().slice(0,20).forEach(entry=>{
      html += `
        <div class="weight-entry">
          <span class="d">${fmtDate(entry.date)}</span>
          <span class="v">${entry.value} kg</span>
          <div style="display:flex; gap:4px;">
            <button class="del-btn" onclick="editWeight('${entry.date}')" title="Edit">✎</button>
            <button class="del-btn" onclick="deleteWeight('${entry.date}')" title="Delete">✕</button>
          </div>
        </div>
      `;
    });
  }

  html += `
    <div class="add-form" style="margin-top:22px;">
      <div class="section-title" style="margin-bottom:12px;">Full History Report</div>
      <div class="row-2">
        <div class="field"><label>From</label><input type="date" id="reportFrom" value="${reportFrom}"></div>
        <div class="field"><label>To</label><input type="date" id="reportTo" value="${reportTo}"></div>
      </div>
      <button class="btn" onclick="generateReport()">Generate Report</button>
      ${reportGenerated ? renderReportSummary(reportGenerated) : ''}
    </div>
  `;

  return html;
}

function handleAddWeight(){
  const input = document.getElementById('weightInput');
  const dateInput = document.getElementById('weightDate');
  addWeight(input.value, dateInput ? dateInput.value : null);
}

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

function render(){
  const now = new Date();
  const dayName = now.toLocaleDateString('en-US',{weekday:'long'});
  const dateNum = now.getDate();
  const monthYear = now.toLocaleDateString('en-US',{month:'long', year:'numeric'});

  let viewHtml = '';
  if(currentTab==='today') viewHtml = renderToday();
  else if(currentTab==='habits') viewHtml = renderHabits();
  else if(currentTab==='workouts') viewHtml = renderWorkouts();
  else if(currentTab==='calories') viewHtml = renderCalories();
  else if(currentTab==='progress') viewHtml = renderProgress();

  document.getElementById('app').innerHTML = `
    <div class="header">
      <div class="eyebrow">The Ledger — Training Log</div>
      <div class="date-stamp">${dayName}<span class="day">${dateNum}</span><span style="font-size:16px; color:var(--muted); text-transform:none; font-family:'IBM Plex Sans',sans-serif; font-weight:400;">${monthYear}</span></div>
      <div class="backup-bar">
        <button class="backup-link" onclick="exportBackup()">⤓ Backup</button>
        <button class="backup-link" onclick="triggerImport()">⤒ Restore</button>
      </div>
      <div class="account-bar">
        <span class="account-email">${currentUser ? escapeHtml(currentUser.email) : ''}</span>
        <button class="backup-link" onclick="doLogout()">Log Out</button>
      </div>
    </div>
    ${renderTabs()}
    <div class="view active">${viewHtml}</div>
  `;

  if(currentTab==='workouts') renderExerciseRows();
}
</script>
</body>
</html>
